[project]
name = "simple-rag"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.163.0",
    "langchain-anthropic>=1.7.10",
    "langchain-core>=1.8.0",
    "langchain-huggingface>=1.2.3",
    "langchain-postgres>=0.0.19",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.22",
    "langgraph-checkpoint-postgres>=3.2.1",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.16.3",
    "python-multipart>=0.0.33",
    "requests>=2.34.2",
    "sentence-transformers>=6.3.0",
    "streamlit>=1.67.0",
    "torch>=2.15.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[tool.pytest.ini_options]
pythonpath = ["."]
